<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Profile &middot; Brixo</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body><div id="page"><div id="banner"></div><div id="nav"></div>
<div id="content"></div>
<div id="footer"></div></div>
<script>
(async () => {
  const name = decodeURIComponent(location.pathname.split("/").pop());
  let p = null;
  try { p = await api(`/api/users/${encodeURIComponent(name)}`); } catch (e) {}
  const me = await shell(null);
  if (me && p && me.username === p.username) {
    const tab = [...document.querySelectorAll("#nav .tab")].find((t) => t.textContent === "Profile");
    if (tab) tab.classList.add("on");
  }
  const content = document.getElementById("content");
  if (!p) {
    content.innerHTML = `<div class="box"><h2>Player not found</h2><div class="inner">
      <p>Nobody on Brixo goes by <b>${esc(name)}</b>.</p><a class="btn" href="/">Home</a></div></div>`;
    return;
  }
  document.title = `${p.username} · Brixo`;
  const mine = me && me.username === p.username;
  const visits = p.games.reduce((n, g) => n + g.visits, 0);
  const statusLine = p.status === "playing"
    ? `<span class="status playing">${p.game ? `Playing <a href="/games/${p.game.id}">${esc(p.game.name)}</a>
         <button class="btn small green" data-join="${p.game.id}" data-name="${esc(p.game.name)}">Join</button>` : "In a game"}</span>`
    : p.status === "online" ? `<span class="status online">Online</span>`
    : p.last_seen ? `<span class="status">Last online ${ago(p.last_seen)}</span>` : "";
  content.innerHTML = `<div class="box profile-head"><h2>${esc(p.username)}'s Profile</h2><div class="inner">
      <div class="avatar-frame">${avatarSvg(p.avatar)}</div>
      <div class="info">
        <div class="pname">${esc(p.username)} ${statusLine}</div>
        <div id="blurb"></div>
        <div class="statrow">
          <div><b>${when(p.created) || "Early days"}</b><span>Joined</span></div>
          <div><b>${num(p.games.length)}</b><span>Games made</span></div>
          <div><b>${num(visits)}</b><span>Game visits</span></div>
          <div><b>${num(p.friend_count)}</b><span>Friends</span></div>
        </div>
        <div id="friendbtn"></div>
        ${mine ? `<p class="links"><a class="btn small gold" href="/avatar">Change your character</a> <a class="btn small gray" href="#" id="pw">Change your password</a></p><div id="pwbox"></div>` : ""}
      </div>
    </div></div>
    <div class="cols"><div class="main">
      <div class="box"><h2>${esc(p.username)}'s Games</h2><div class="inner">
        ${p.games.length ? `<div class="grid">${popular(p.games).map(gameCard).join("")}</div>`
          : mine ? `<p>You haven't published a game yet. Build one in <b>Brixo Studio</b> and press <b>Publish</b>.</p>
                    <a class="btn" href="/download">Get Brixo Studio</a>`
                 : `<p style="margin:0">${esc(p.username)} hasn't published any games yet.</p>`}
      </div></div>
    </div><div class="side" style="width:260px">
      <div class="box"><h2>Friends (${num(p.friend_count)})${mine && p.friend_count ? ` <a href="/friends">See all &raquo;</a>` : ""}</h2><div class="inner">
        ${p.friend_count ? `<div class="profile-friends">${p.friends.map((f) => `<a href="/users/${encodeURIComponent(f.username)}">${avatarHead(f.avatar, 64)}<span>${esc(f.username)}</span></a>`).join("")}</div>`
          : `<p class="hint" style="margin:0">${mine ? "No friends yet." : `${esc(p.username)} hasn't added any friends yet.`}</p>`}
      </div></div>
    </div></div>`;
  wireJoins(content);

  // Add Friend (and friends, asked, or answering theirs).
  const fb = document.getElementById("friendbtn");
  const drawFriend = (rel, message) => {
    if (!me || mine || !rel) { fb.innerHTML = ""; return; }
    const who = esc(p.username);
    fb.innerHTML = (rel === "friends" ? `<p class="hint" style="color:#2f7d32;font-weight:bold">&#10003; Friends</p>`
      : rel === "sent" ? `<button class="btn small gray" disabled>Request sent</button>`
      : rel === "received" ? `<p class="hint">${who} wants to be friends.</p><button class="btn small green" id="fyes">Accept</button> <button class="btn small gray" id="fno">Decline</button>`
      : `<button class="btn small gold" id="fadd">Add Friend</button>`) + (message ? `<div class="hint">${esc(message)}</div>` : "");
    const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
    const go = async (path, next) => {
      try { const r = await api(path, "POST", { username: p.username }); drawFriend(next(r), r && r.message); }
      catch (err) { drawFriend(rel, err.message); }
    };
    on("fadd", () => go("/api/friends/add", (r) => r.result));
    on("fyes", () => go("/api/friends/accept", () => "friends"));
    on("fno", () => go("/api/friends/decline", () => "none"));
  };
  drawFriend(p.relation);

  const box = document.getElementById("blurb");
  const show = () => {
    box.innerHTML = (p.blurb ? `<div class="blurb">${esc(p.blurb)}</div>`
                             : mine ? `<p class="hint" style="margin:8px 0 4px">Say something about yourself.</p>` : "")
      + (mine ? `<a href="#" id="edit" style="font-size:11px">${p.blurb ? "Edit" : "Write"} your About Me</a>` : "");
    const edit = document.getElementById("edit");
    if (edit) edit.onclick = (e) => {
      e.preventDefault();
      box.innerHTML = `<textarea id="text" rows="3" maxlength="200" style="width:100%;margin-top:8px">${esc(p.blurb)}</textarea>
        <div class="error" id="err"></div>
        <button class="btn small gold" id="save">Save</button> <button class="btn small gray" id="cancel">Cancel</button>`;
      document.getElementById("cancel").onclick = show;
      document.getElementById("save").onclick = async () => {
        try {
          await api("/api/me/blurb", "PUT", { blurb: document.getElementById("text").value });
          p = await api(`/api/users/${encodeURIComponent(p.username)}`);
          show();
        } catch (err) { document.getElementById("err").textContent = err.message; }
      };
    };
  };
  show();

  const pw = document.getElementById("pw");
  if (pw) pw.onclick = (e) => {
    e.preventDefault();
    const box = document.getElementById("pwbox");
    box.innerHTML = `<form id="pwform" class="pwform">
      <input type="text" name="username" autocomplete="username" value="${esc(p.username)}" hidden>
      <div class="field"><label for="cur">Current password</label><input id="cur" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="new1">New password</label><input id="new1" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></div>
      <div class="field"><label for="new2">Type it again</label><input id="new2" type="password" autocomplete="new-password" required></div>
      <div class="error" id="pwerr"></div>
      <button class="btn small gold" type="submit">Save</button> <button class="btn small gray" type="button" id="pwcancel">Cancel</button>
    </form>`;
    document.getElementById("pwcancel").onclick = () => { box.innerHTML = ""; };
    const f = document.getElementById("pwform");
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      const err = document.getElementById("pwerr");
      if (f.new1.value !== f.new2.value) { err.textContent = "those two don't match"; return; }
      try {
        await api("/api/me/password", "PUT", { current: f.cur.value, password: f.new1.value });
        box.innerHTML = `<p class="hint" style="color:#2f7d32">Password changed. Anywhere else you were logged in has been logged out.</p>`;
      } catch (e2) { err.textContent = e2.message; }
    };
  };
})();
</script></body></html>

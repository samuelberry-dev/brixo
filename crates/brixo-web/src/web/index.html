<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Brixo: build it, play it, share it</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body><div id="page"><div id="banner"></div><div id="nav"></div>
<div id="content"></div>
<div id="footer"></div></div>
<script>
(async () => {
  const me = await shell("home");
  const [games, stats] = await Promise.all([api("/api/games"), api("/api/stats").catch(() => ({}))]);
  const top = popular(games);
  const content = document.getElementById("content");
  const grid = (list) => `<div class="grid">${list.map(gameCard).join("") || "<p>No games yet.</p>"}</div>`;
  const featured = featuredGame(games);

  if (!me) {
    // Visitors: the featured game, what Brixo is, the popular games, and
    // signing up right here.
    content.innerHTML = `${featureBanner(featured)}<div class="cols"><div class="main">
      <div class="box"><h2>Welcome to Brixo!</h2><div class="inner welcome">
        <h1>Brick by brick.</h1>
        <p>Brixo is a free place to play games made of bricks, and to make your own.
           Everything you see here was built in <b>Brixo Studio</b>, from the castles to the rockets.</p>
        <div class="features">
          <div class="feature"><div class="brick-icon" style="background:#c4281c"></div><div><b>Build</b><br>Drag out bricks, snap them together, paint them.</div></div>
          <div class="feature"><div class="brick-icon" style="background:#0d69ac"></div><div><b>Script</b><br>Make them do things with Rovik, a language built for Brixo.</div></div>
          <div class="feature"><div class="brick-icon" style="background:#4b974b"></div><div><b>Play together</b><br>Publish it, and your friends can join in.</div></div>
        </div>
      </div></div>
      <div class="box"><h2>Popular Games <a href="/games">See all &raquo;</a></h2><div class="inner">${grid(top.slice(0, 6))}</div></div>
    </div><div class="side">
      <div class="box gold"><h2>Sign up and play!</h2><div class="inner">
        <form id="signup" autocomplete="on">
          <div class="field"><label for="su-user">Pick a username</label><input id="su-user" autocomplete="username" required maxlength="20"></div>
          <div class="field"><label for="su-pass">Password (8+ characters)</label><input id="su-pass" type="password" autocomplete="new-password" required></div>
          ${stats.invite_only ? `<div class="field"><label for="su-invite">Invite code</label><input id="su-invite" placeholder="XXXX-XXXX-XXXX" autocomplete="off" required></div>` : ""}
          <div class="error" id="su-error"></div>
          <button class="btn gold big" type="submit">Sign Up</button>
          <p class="hint" style="margin-top:6px">${stats.invite_only ? "Brixo is invite-only for now. Got a code from a friend? You're in." : "It's free."} Already have an account? Log in at the top.</p>
        </form>
      </div></div>
      <div class="box"><h2>Right now on Brixo</h2><div class="inner numbers">
        <div><b>${num(stats.online)}</b><span>playing</span></div>
        <div><b>${num(stats.games)}</b><span>games</span></div>
        <div><b>${num(stats.users)}</b><span>builders</span></div>
      </div></div>
      <div class="box navy"><h2>Make your own</h2><div class="inner soft">
        <p>Brixo Studio is where games are made. Bricks, scripts, sounds, teams, tools: it's all in there.</p>
        <a class="btn" href="/download">Get Brixo &raquo;</a>
      </div></div>
    </div></div>`;
    wireJoins(content);
    const f = document.getElementById("signup");
    f.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api("/api/signup", "POST", { username: f["su-user"].value, password: f["su-pass"].value,
                                           invite: f["su-invite"] ? f["su-invite"].value : "" });
        location.href = "/avatar";
      } catch (err) { document.getElementById("su-error").textContent = err.message; }
    };
    return;
  }

  // Logged in: My Brixo. You on the left; your friends, what you played
  // last and what's popular in the middle.
  const noHome = { friends_online: [], friend_count: 0, recent: [] };
  const [home, mine] = await Promise.all([
    api("/api/home").catch(() => noHome),
    api(`/api/users/${encodeURIComponent(me.username)}`).then((p) => p.games).catch(() => []),
  ]);
  const friendTile = (f) => {
    const url = `/users/${encodeURIComponent(f.username)}`;
    return `<div class="friend-tile ${f.status}">
      <a class="head" href="${url}">${avatarHead(f.avatar, 64)}<span class="pip"></span></a>
      <a class="nm" href="${url}">${esc(f.username)}</a>
      <div class="doing">${f.status === "playing" ? (f.game ? esc(f.game.name) : "In a game") : "Online"}</div>
      ${f.game ? `<button class="btn small green" data-join="${f.game.id}" data-name="${esc(f.game.name)}">Join</button>` : ""}
    </div>`;
  };
  const friendsInner = (h) => h.friends_online.length ? `<div class="friend-strip">${h.friends_online.map(friendTile).join("")}</div>`
    : h.friend_count ? `<p class="hint" style="margin:0">None of your ${num(h.friend_count)} friend${h.friend_count === 1 ? " is" : "s are"} on right now.</p>`
    : `<p class="hint" style="margin:0">No friends yet. Visit someone's profile and press <b>Add Friend</b>, or <a href="/friends">find them by name</a>.</p>`;
  const friendsTitle = (h) => `Friends Online${h.friends_online.length ? ` (${h.friends_online.length})` : ""} <a href="/friends">All friends &raquo;</a>`;
  content.innerHTML = `<div class="cols"><div class="side" style="width:230px">
      <div class="box"><h2>Hello, ${esc(me.username)}!</h2><div class="inner">
        <div class="avatar-frame">${avatarSvg(me.avatar)}</div>
        ${me.brix !== undefined ? `<div class="wallet"><span class="brix-icon"></span><b>${num(me.brix)}</b> Brix</div>` : ""}
        <ul class="quick">
          <li><a href="/avatar">Change your character</a></li>
          <li><a href="/catalog">Shop the Catalog</a></li>
          <li><a href="/users/${encodeURIComponent(me.username)}">Your profile</a></li>
          <li><a href="/friends">Friends${me.friend_requests ? ` <span class="badge">${me.friend_requests}</span>` : ""}</a></li>
          <li><a href="/download">Get Player and Studio</a></li>
        </ul>
      </div></div>
      <div class="box"><h2>Right now</h2><div class="inner numbers">
        <div><b>${num(stats.online)}</b><span>playing</span></div>
        <div><b>${num(stats.games)}</b><span>games</span></div>
      </div></div>
      ${mine.length ? "" : `<div class="box navy"><h2>Make your own</h2><div class="inner soft">
        <p>Build a game in <b>Brixo Studio</b> and press <b>Publish</b>: it shows up here and in Games.</p>
        <a class="btn" href="/download">Get Brixo Studio</a>
      </div></div>`}
    </div><div class="main">
      <div class="box" id="friends-online"><h2>${friendsTitle(home)}</h2><div class="inner">${friendsInner(home)}</div></div>
      ${home.recent.length ? `<div class="box"><h2>Continue Playing</h2><div class="inner">${grid(home.recent.slice(0, 4))}</div></div>` : ""}
      <div class="box"><h2>Popular Games <a href="/games">See all &raquo;</a></h2><div class="inner">${grid(top.slice(0, home.recent.length ? 4 : 8))}</div></div>
      ${mine.length ? `<div class="box"><h2>Your Games <a href="/users/${encodeURIComponent(me.username)}">See all &raquo;</a></h2><div class="inner">${grid(popular(mine).slice(0, 4))}</div></div>` : ""}
    </div></div>`;
  wireJoins(content);
  // Keep who's on up to date while the page is open.
  setInterval(async () => {
    if (document.hidden) return;
    const h = await api("/api/home").catch(() => null);
    if (!h) return;
    const box = document.getElementById("friends-online");
    box.innerHTML = `<h2>${friendsTitle(h)}</h2><div class="inner">${friendsInner(h)}</div>`;
    wireJoins(box);
  }, 30000);
})();
</script></body></html>

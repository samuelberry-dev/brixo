<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Brixo: build it, play it, share it</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body><div id="page"><div id="banner"></div><div id="nav"></div>
<div id="content"></div>
<div id="footer"></div></div>
<script>
(async () => {
  const me = await shell("home");
  const [games, stats] = await Promise.all([api("/api/games"), api("/api/stats").catch(() => ({}))]);
  const top = popular(games);
  const content = document.getElementById("content");
  const grid = (list) => `<div class="grid">${list.map(gameCard).join("") || "<p>No games yet.</p>"}</div>`;
  const featured = top.find((g) => g.has_thumbnail) || top[0];

  if (!me) {
    // Visitors: what Brixo is, the popular games, and signing up right here.
    content.innerHTML = `<div class="cols"><div class="main">
      <div class="box"><h2>Welcome to Brixo!</h2><div class="inner hero">
        <a class="shot bigthumb" href="${featured ? `/games/${featured.id}` : "/games"}">${featured ? thumb(featured) : ""}</a>
        <div class="words">
          <h1>Brick by brick.</h1>
          <p>Brixo is a free place to play games made of bricks, and to make your own.
             Everything you see here was built in <b>Brixo Studio</b>, from the castles to the rockets.</p>
          <div class="feature"><div class="brick-icon" style="background:#c4281c"></div><div><b>Build</b><br>Drag out bricks, snap them together, paint them.</div></div>
          <div class="feature"><div class="brick-icon" style="background:#0d69ac"></div><div><b>Script</b><br>Make them do things with Rovik, a language built for Brixo.</div></div>
          <div class="feature"><div class="brick-icon" style="background:#4b974b"></div><div><b>Play together</b><br>Publish it, and your friends can join in.</div></div>
        </div>
      </div></div>
      <div class="box"><h2>Popular Games <a href="/games">See all &raquo;</a></h2><div class="inner">${grid(top.slice(0, 5))}</div></div>
    </div><div class="side">
      <div class="box gold"><h2>Sign up and play!</h2><div class="inner">
        <form id="signup" autocomplete="on">
          <div class="field"><label for="su-user">Pick a username</label><input id="su-user" autocomplete="username" required maxlength="20"></div>
          <div class="field"><label for="su-pass">Password (6+ characters)</label><input id="su-pass" type="password" autocomplete="new-password" required></div>
          <div class="error" id="su-error"></div>
          <button class="btn gold big" type="submit">Sign Up</button>
          <p class="hint" style="margin-top:6px">It's free. Already have an account? Log in at the top.</p>
        </form>
      </div></div>
      <div class="box"><h2>Right now on Brixo</h2><div class="inner numbers">
        <div><b>${num(stats.online)}</b><span>playing</span></div>
        <div><b>${num(stats.games)}</b><span>games</span></div>
        <div><b>${num(stats.users)}</b><span>builders</span></div>
      </div></div>
      <div class="box navy"><h2>Make your own</h2><div class="inner soft">
        <p>Brixo Studio is where games are made. Bricks, scripts, sounds, teams, tools: it's all in there.</p>
        <a class="btn" href="/download">Get Brixo &raquo;</a>
      </div></div>
    </div></div>`;
    const f = document.getElementById("signup");
    f.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api("/api/signup", "POST", { username: f["su-user"].value, password: f["su-pass"].value });
        location.href = "/avatar";
      } catch (err) { document.getElementById("su-error").textContent = err.message; }
    };
    return;
  }

  // Logged in: My Brixo.
  const mine = await api(`/api/users/${encodeURIComponent(me.username)}`).then((p) => p.games).catch(() => []);
  content.innerHTML = `<div class="cols"><div class="side" style="width:240px">
      <div class="box"><h2>Hello, ${esc(me.username)}!</h2><div class="inner">
        <div class="avatar-frame">${avatarSvg(me.avatar)}</div>
        <p style="margin-top:8px"><a href="/avatar">&raquo; Change your character</a><br>
           <a href="/users/${encodeURIComponent(me.username)}">&raquo; View your profile</a><br>
           <a href="/download">&raquo; Get Brixo Player and Studio</a></p>
      </div></div>
    </div><div class="main">
      <div class="box"><h2>Popular Games <a href="/games">See all &raquo;</a></h2><div class="inner">${grid(top.slice(0, 8))}</div></div>
      <div class="box"><h2>Your Games</h2><div class="inner">${mine.length ? grid(mine)
        : `<p>You haven't published a game yet. Build one in <b>Brixo Studio</b> and press <b>Publish</b>: it shows up here and in Games.</p>
           <a class="btn" href="/download">Get Brixo Studio</a>`}</div></div>
    </div></div>`;
})();
</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Admin &middot; Brixo</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body><div id="page"><div id="banner"></div><div id="nav"></div>
<div id="content"></div>
<div id="shop-admin" style="padding:0 10px"></div>
<div id="toolbox-admin"></div>
<div id="footer"></div></div>
<script>
(async () => {
  const me = await shell("admin");
  const content = document.getElementById("content");
  if (!me || !me.admin) {
    content.innerHTML = `<div class="box"><h2>Admins only</h2><div class="inner"><p>This page is for Brixo's admins.</p>
      <a class="btn" href="/">Home</a></div></div>`;
    return;
  }
  const filter = { users: "", games: "" };
  let data = null;
  const load = async () => { data = await api("/api/admin"); draw(); };
  const act = async (path, body, what) => {
    try { await api(path, "POST", body); await load(); }
    catch (err) { alert(`Couldn't ${what}: ${err.message}`); }
  };
  const draw = () => {
    const users = data.users.filter((u) => u.username.toLowerCase().includes(filter.users.toLowerCase()));
    const games = data.games.filter((g) => (g.name + " " + g.owner).toLowerCase().includes(filter.games.toLowerCase()));
    content.innerHTML = `<div class="cols"><div class="main">
      <div class="box navy"><h2>Games <span style="font-weight:normal">newest first</span></h2><div class="inner">
        <input class="find" id="gfind" placeholder="Find a game or maker" value="${esc(filter.games)}">
        <table class="admin"><tr><th>Game</th><th>By</th><th>Visits</th><th>Published</th><th></th></tr>
        ${games.map((g) => `<tr class="${g.hidden || g.owner_banned ? "off" : ""}">
          <td>${g.hidden || g.owner_banned || g.admin_only ? esc(g.name) : `<a href="/games/${g.id}">${esc(g.name)}</a>`}
              ${g.hidden ? `<span class="tag">taken down</span>` : ""}${g.owner_banned ? `<span class="tag">maker banned</span>` : ""}${g.admin_only ? `<span class="tag gold">admins only</span>` : ""}${g.featured ? `<span class="tag gold">&#9733; featured</span>` : ""}
              ${g.admin_only && !g.hidden ? `<div><button class="btn small green" data-play="${g.id}" data-name="${esc(g.name)}">Play</button>
                <a href="#" data-public="${g.id}" style="font-size:10px">make public</a></div>`
                : g.hidden ? "" : `<div><a href="#" data-private="${g.id}" style="font-size:10px">admins only</a>
                &middot; <a href="#" data-feature="${g.id}" data-on="${g.featured ? 0 : 1}" style="font-size:10px">${g.featured ? "unfeature" : "feature"}</a></div>`}</td>
          <td>${esc(g.owner)}</td><td>${num(g.visits)}</td><td>${when(g.created)}</td>
          <td>${g.hidden
            ? `<button class="btn small gray" data-show="${g.id}">Put back</button>`
            : `<button class="btn small" data-hide="${g.id}" data-name="${esc(g.name)}" style="background:linear-gradient(180deg,#f7a59c 0%,#e0574a 50%,#c4281c 51%,#d23a2d 100%);border-color:#8a1d14">Take down</button>`}</td>
        </tr>`).join("") || `<tr><td colspan="5" class="hint">No games match.</td></tr>`}
        </table>
      </div></div>
    </div><div class="side" style="width:340px">
      <div class="box navy"><h2>Accounts <span style="font-weight:normal">newest first</span></h2><div class="inner">
        <input class="find" id="ufind" placeholder="Find an account" value="${esc(filter.users)}">
        <table class="admin"><tr><th>Name</th><th>Games</th><th></th></tr>
        ${users.map((u) => `<tr class="${u.banned ? "off" : ""}">
          <td>${u.banned ? esc(u.username) : `<a href="/users/${encodeURIComponent(u.username)}">${esc(u.username)}</a>`}
              ${u.admin ? `<span class="tag gold">admin</span>` : ""}${u.banned ? `<span class="tag">banned</span>` : ""}
              <div class="hint">${when(u.created) || "early days"}</div></td>
          <td>${num(u.games)}</td>
          <td style="white-space:nowrap">${u.banned ? "" : `<button class="btn small gray" data-reset="${esc(u.username)}" title="Make a one-time link to choose a new password">Reset</button> `}${u.admin || u.username === "Brixo" ? "" : u.banned
            ? `<button class="btn small gray" data-unban="${esc(u.username)}">Unban</button>`
            : `<button class="btn small" data-ban="${esc(u.username)}" style="background:linear-gradient(180deg,#f7a59c 0%,#e0574a 50%,#c4281c 51%,#d23a2d 100%);border-color:#8a1d14">Ban</button>`}</td>
        </tr>`).join("") || `<tr><td colspan="3" class="hint">No accounts match.</td></tr>`}
        </table>
        <div id="resetlink"></div>
        <p class="hint" style="margin-top:8px"><b>Reset</b> makes a one-time link to choose a new password, good for an hour: send it to them yourself. A ban logs them out, sends them out of any game they're in, keeps them from logging in or playing, and hides their profile and games. Unban puts it all back.</p>
      </div></div>
    </div></div>`;
    const keep = (id, key) => {
      const box = document.getElementById(id);
      box.oninput = () => { filter[key] = box.value; draw(); document.getElementById(id).focus(); const b = document.getElementById(id); b.setSelectionRange(b.value.length, b.value.length); };
    };
    keep("gfind", "games");
    keep("ufind", "users");
    content.querySelectorAll("[data-hide]").forEach((b) => b.onclick = () => {
      if (confirm(`Take down "${b.dataset.name}"? It disappears from the site, and anyone playing it is sent home.`)) act("/api/admin/hide", { id: Number(b.dataset.hide), hidden: true }, "take it down");
    });
    content.querySelectorAll("[data-show]").forEach((b) => b.onclick = () => act("/api/admin/hide", { id: Number(b.dataset.show), hidden: false }, "put it back"));
    content.querySelectorAll("[data-ban]").forEach((b) => b.onclick = () => {
      if (confirm(`Ban ${b.dataset.ban}?`)) act("/api/admin/ban", { username: b.dataset.ban, banned: true }, "ban them");
    });
    content.querySelectorAll("[data-play]").forEach((b) => b.onclick = () => playGame({ id: Number(b.dataset.play), name: b.dataset.name }, b));
    content.querySelectorAll("[data-public]").forEach((a) => a.onclick = (e) => {
      e.preventDefault();
      if (confirm("Make this game public? Everyone will see it in Games.")) act("/api/admin/admin-only", { id: Number(a.dataset.public), admin_only: false }, "make it public");
    });
    content.querySelectorAll("[data-private]").forEach((a) => a.onclick = (e) => {
      e.preventDefault();
      if (confirm("Make this game admins only? It disappears from Games, and anyone playing it is sent home.")) act("/api/admin/admin-only", { id: Number(a.dataset.private), admin_only: true }, "make it admins only");
    });
    content.querySelectorAll("[data-feature]").forEach((a) => a.onclick = (e) => {
      e.preventDefault();
      act("/api/admin/feature", { id: Number(a.dataset.feature), featured: a.dataset.on === "1" }, a.dataset.on === "1" ? "feature it" : "unfeature it");
    });
    content.querySelectorAll("[data-reset]").forEach((b) => b.onclick = async () => {
      if (!confirm(`Make a password reset link for ${b.dataset.reset}?`)) return;
      const box = document.getElementById("resetlink");
      try {
        const r = await api("/api/admin/reset", "POST", { username: b.dataset.reset });
        const link = `${location.origin}/reset#${r.token}`;
        box.innerHTML = `<div class="resetlink"><b>Reset link for ${esc(r.username)}</b> <span class="hint">(works once, for ${r.minutes} minutes)</span>
          <input readonly value="${esc(link)}" id="linkbox"><button class="btn small gold" id="copylink">Copy</button></div>`;
        const input = document.getElementById("linkbox");
        input.onclick = () => input.select();
        document.getElementById("copylink").onclick = async (e) => {
          try { await navigator.clipboard.writeText(link); e.target.textContent = "Copied!"; }
          catch (_) { input.select(); }
        };
      } catch (err) { alert(`Couldn't make a link: ${err.message}`); }
    });
    content.querySelectorAll("[data-unban]").forEach((b) => b.onclick = () => act("/api/admin/ban", { username: b.dataset.unban, banned: false }, "unban them"));
  };
  load().catch((err) => { content.innerHTML = `<div class="box"><h2>Admin</h2><div class="inner"><p class="error">${esc(err.message)}</p></div></div>`; });
  toolboxAdmin();
  shopAdmin();
})();

// Brix: games' challenges (new ones wait here to be approved and given
// Brix), the Catalog's prices, and giving someone Brix.
async function shopAdmin() {
  const root = document.getElementById("shop-admin");
  let note = "";
  const draw = async () => {
    const d = await api("/api/admin/challenges");
    const waiting = d.challenges.filter((c) => !c.approved).length;
    const row = (c) => `<tr class="${c.approved ? "" : "waiting"}" data-ch="${c.id}">
      <td><a href="/games/${c.game_id}">${esc(c.game)}</a><div class="hint"><code>${esc(c.name)}</code> &middot; done ${num(c.completed)}&times;</div></td>
      <td><input name="title" value="${esc(c.title)}" maxlength="40"></td>
      <td><input name="reward" type="number" min="0" max="500" value="${c.reward}" style="width:64px"></td>
      <td style="text-align:center"><input name="daily" type="checkbox" ${c.daily ? "checked" : ""}></td>
      <td>${c.approved ? `<button class="btn small" data-save>Save</button> <a href="#" data-unapprove style="font-size:10px">stop paying</a>`
                       : `<button class="btn small green" data-approve>Approve</button>`}</td></tr>`;
    const priced = d.items.filter((i) => i.price > 0 || d.changed_prices[i.id] !== undefined);
    root.innerHTML = `<div class="box gold"><h2>Challenges &amp; Brix ${waiting ? `<span class="badge">${waiting} waiting</span>` : ""}</h2><div class="inner">
      ${note ? `<div class="notice">${esc(note)}</div>` : ""}
      <p class="hint">A game's script calls <code>complete_challenge(player, "name")</code>. A name a game hasn't used before shows up here, paying nothing until you approve it. Each challenge pays once per player (daily ones, once a day), and challenges pay each player at most ${num(200)} Brix a day.</p>
      <table class="admin"><tr><th>Game</th><th>Title players see</th><th>Brix</th><th>Daily</th><th></th></tr>
        ${d.challenges.map(row).join("") || `<tr><td colspan="5" class="hint">No challenges yet.</td></tr>`}</table>
      <div class="cols" style="margin-top:12px">
        <div class="main"><details><summary><b>Catalog prices</b> <span class="hint">(${priced.length} things for sale; change a price and press Enter)</span></summary>
          <table class="admin"><tr><th>Item</th><th>Brix</th><th></th></tr>
          ${d.items.filter((i) => i.price > 0 || d.changed_prices[i.id] !== undefined).map((i) => `<tr><td>${esc(i.title)} <span class="hint">${esc(i.kind)}</span></td>
            <td><input type="number" min="0" data-price="${i.id}" value="${i.price}" style="width:70px"></td>
            <td>${d.changed_prices[i.id] !== undefined ? `<a href="#" data-reset-price="${i.id}" style="font-size:10px">usual price</a>` : ""}</td></tr>`).join("")}</table>
        </details></div>
        <div class="side" style="width:260px"><b>Give Brix</b>
          <form id="gift" class="addfriend" style="margin-top:4px"><input name="who" placeholder="Username" required style="width:110px">
          <input name="amount" type="number" placeholder="Brix" required style="width:70px"><button class="btn small gold">Give</button></form>
          <p class="hint">A minus takes Brix away.</p></div>
      </div>
    </div></div>`;
    const save = async (tr, approved) => {
      const f = (n) => tr.querySelector(`[name=${n}]`);
      try {
        await api("/api/admin/challenges", "POST", { id: Number(tr.dataset.ch), title: f("title").value, reward: Number(f("reward").value), daily: f("daily").checked, approved });
        note = approved ? `"${f("title").value}" pays ${f("reward").value} Brix.` : `"${f("title").value}" doesn't pay any more.`;
        draw();
      } catch (err) { alert(err.message); }
    };
    root.querySelectorAll("[data-approve], [data-save]").forEach((b) => b.onclick = () => save(b.closest("tr"), true));
    root.querySelectorAll("[data-unapprove]").forEach((a) => a.onclick = (e) => { e.preventDefault(); save(a.closest("tr"), false); });
    root.querySelectorAll("[data-price]").forEach((inp) => inp.onchange = async () => {
      try { await api("/api/admin/price", "POST", { item: inp.dataset.price, price: Number(inp.value) }); note = "Price changed."; draw(); }
      catch (err) { alert(err.message); }
    });
    root.querySelectorAll("[data-reset-price]").forEach((a) => a.onclick = async (e) => {
      e.preventDefault();
      await api("/api/admin/price", "POST", { item: a.dataset.resetPrice, price: null }).catch((err) => alert(err.message));
      draw();
    });
    document.getElementById("gift").onsubmit = async (e) => {
      e.preventDefault();
      const el = e.target.elements;
      try {
        const r = await api("/api/admin/brix", "POST", { username: el.who.value.trim(), amount: Number(el.amount.value) });
        note = `${r.username} has ${num(r.brix)} Brix now.`;
        draw();
      } catch (err) { alert(err.message); }
    };
  };
  draw().catch((err) => { root.innerHTML = `<p class="error">${esc(err.message)}</p>`; });
}

// The toolbox: what Studio's Toolbox offers. Brixo's own items come from
// the code; admins add more here (or with brixo-admin toolbox-add).
async function toolboxAdmin() {
  const root = document.getElementById("toolbox-admin");
  const categories = ["Vehicles", "Building", "Obby", "Gameplay", "Weapons"];
  const draw = async (note) => {
    const items = await api("/api/toolbox");
    root.innerHTML = `<div class="box navy" style="margin-top:12px"><h2>Toolbox <span style="font-weight:normal">what Studio's Toolbox offers</span></h2><div class="inner">
      <div class="toolbox-grid">${items.map((i) => `<div class="toolbox-item" title="${esc(i.description)}">
        ${i.has_thumbnail ? `<img src="/api/toolbox/${i.id}/thumbnail" alt="">` : `<div class="noimg">no picture</div>`}
        <b>${esc(i.name)}</b><div class="hint">${esc(i.category)}${i.builtin ? " &middot; built in" : ""}</div>
        <a href="#" data-tbremove="${i.id}" data-name="${esc(i.name)}" style="font-size:10px">remove</a>
      </div>`).join("") || `<p class="hint">The toolbox is empty.</p>`}</div>
      <h3 style="margin-top:14px">Add to the toolbox</h3>
      <p class="hint">Build it in Studio, select it, press <b>Ctrl+C</b>, and paste it in the box below. Its scripts should find what they need through <code>self</code>, not <code>find(...)</code>, so it works in any game. A picture is a square PNG (160 by 160 is plenty).</p>
      <form id="tbform" class="tbform">
        <label>Name <input name="name" maxlength="50" required></label>
        <label>Category <input name="category" list="tbcats" maxlength="30" required><datalist id="tbcats">${categories.map((c) => `<option value="${c}">`).join("")}</datalist></label>
        <label>Description <input name="description" maxlength="400"></label>
        <label>Picture <input name="picture" type="file" accept="image/png"></label>
        <label>What it's made of <textarea name="content" rows="4" placeholder="Paste what you copied in Studio here" required></textarea></label>
        <button class="btn green" type="submit">Add it</button> <span id="tbnote" class="hint">${note ? esc(note) : ""}</span>
      </form>
    </div></div>`;
    root.querySelectorAll("[data-tbremove]").forEach((a) => a.onclick = async (e) => {
      e.preventDefault();
      if (!confirm(`Take "${a.dataset.name}" out of the toolbox? Games that already use it keep their copy.`)) return;
      try { await api("/api/admin/toolbox/remove", "POST", { id: Number(a.dataset.tbremove) }); draw(`Removed ${a.dataset.name}.`); }
      catch (err) { alert(`Couldn't remove it: ${err.message}`); }
    });
    document.getElementById("tbform").onsubmit = async (e) => {
      e.preventDefault();
      const el = e.target.elements;
      const v = (n) => el[n].value;
      const file = el["picture"].files[0];
      let thumbnail = null;
      if (file) {
        thumbnail = await new Promise((ok, no) => {
          const r = new FileReader();
          r.onload = () => ok(String(r.result).split(",")[1]);
          r.onerror = no;
          r.readAsDataURL(file);
        });
      }
      try {
        await api("/api/admin/toolbox", "POST", { name: v("name"), category: v("category"), description: v("description"), content: v("content"), thumbnail });
        draw(`Added ${v("name")}. Studio shows it next time its Toolbox loads.`);
      } catch (err) { document.getElementById("tbnote").innerHTML = `<span class="error">${esc(err.message)}</span>`; }
    };
  };
  draw().catch(() => {});
}
</script></body></html>
